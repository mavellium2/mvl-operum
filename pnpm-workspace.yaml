packages:
  - "."
  - "*"
overrides:
  # GHSA-mrhx-c7xc-m3w5 (memória em coleções grandes): correção dentro da v4.
  zod: ">=4.6.6 <5.0.0"
  # GHSA-q3jh-wrc6-jgq8 e GHSA-587h-7wmj-h5pm: manter correções compatíveis.
  follow-redirects: "1.16.1"
  vite: "8.3.3"
  shell-quote: ">=1.11.0"
  esbuild: ">=0.28.1"
  hono: ">=4.12.34"
  "@hono/node-server": ">=2.0.10"
  postcss: ">=8.5.18"
  nanoid: ">=3.3.18"
  multer: ">=2.3.0"
  undici: ">=7.29.1 <8.0.0"
  fast-uri: ">=4.1.4 <5.0.0"
  # GHSA-qhr7-859c-m2p7 (DoS em chaves aninhadas): correção dentro de cada major.
  "brace-expansion@<1.1.20": ">=1.1.20 <2.0.0"
  "brace-expansion@>=2.0.0 <2.1.6": ">=2.1.6 <3.0.0"
  "brace-expansion@>=4.0.0 <5.0.11": ">=5.0.11 <6.0.0"
  js-yaml: ">=4.3.0"
  sharp: ">=0.35.5"
  source-map-js: ">=1.2.2"
  proxy-addr: ">=2.0.8"
  "@modelcontextprotocol/sdk": ">=1.31.0"
  deepmerge-ts: ">=8.0.0"
  browserslist: ">=4.28.7"
  mysql2: ">=3.22.0"
  qs: ">=6.16.0"
  valibot: ">=1.4.2"
  uuid: ">=11.1.1"
allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  prisma: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@next/env@16.3.6'
  - '@next/swc-darwin-arm64@16.3.6'
  - '@next/swc-darwin-x64@16.3.6'
  - '@next/swc-linux-arm64-gnu@16.3.6'
  - '@next/swc-linux-arm64-musl@16.3.6'
  - '@next/swc-linux-x64-gnu@16.3.6'
  - '@next/swc-linux-x64-musl@16.3.6'
  - '@next/swc-win32-arm64-msvc@16.3.6'
  - '@next/swc-win32-x64-msvc@16.3.6'
  - next@16.3.6
patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
# Exceção somente para o código mitigado pelo patch acima (ADR-011).
# Remover patch e exceção quando houver correção publicada; testes validam o limite.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
