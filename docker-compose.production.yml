# Production environment overrides.
# Usage: docker compose -f docker-compose.yml -f docker-compose.production.yml up -d

services:

  app:
    image: ${APP_IMAGE:?release digest required}
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    env_file:
      - .env
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mvl-prod.rule=Host(`operum.adm.br`)"
      - "traefik.http.routers.mvl-prod.entrypoints=websecure"
      - "traefik.http.routers.mvl-prod.tls.certresolver=myresolver"
      - "traefik.http.routers.mvl-prod.service=app-${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.mvl-prod.middlewares=app-ratelimit@file,secure-headers@file"

  # Migrations do app (schema public) — mesma imagem :prod do serviço app.
  # O remote-deploy.sh roda `run --rm migrate` antes do `up -d`.
  migrate:
    image: ${APP_IMAGE:?release digest required}

  migrate-auth-service:
    image: ${AUTH_SERVICE_IMAGE:?release digest required}

  migrate-file-service:
    image: ${FILE_SERVICE_IMAGE:?release digest required}

  api-gateway:
    image: ${API_GATEWAY_IMAGE:?release digest required}
    deploy:
      resources:
        limits:
          memory: 256M
    env_file:
      - .env
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-prod.rule=Host(`api.operum.adm.br`)"
      - "traefik.http.routers.api-prod.entrypoints=websecure"
      - "traefik.http.routers.api-prod.tls.certresolver=myresolver"
      - "traefik.http.routers.api-prod.service=api-gateway-${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.api-prod.middlewares=secure-headers@file"

  mcp-server:
    image: ${MCP_SERVER_IMAGE:?release digest required}
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-https://api.operum.adm.br}
      MCP_UPLOAD_SECRET: ${MCP_UPLOAD_SECRET:-}
    env_file:
      - .env
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp-prod.rule=Host(`mcp.operum.adm.br`)"
      - "traefik.http.routers.mcp-prod.entrypoints=websecure"
      - "traefik.http.routers.mcp-prod.tls.certresolver=myresolver"
      - "traefik.http.routers.mcp-prod.service=mcp-server-${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.mcp-prod.middlewares=secure-headers@file"
      # TODO: remover este router quando o registro DNS de mcp.operum.adm.br existir.
      # Fallback temporário: expõe MCP, uploads e os metadados OAuth do recurso
      # (RFC 9728) em api.operum.adm.br. O resto do host segue no api-gateway.
      - "traefik.http.routers.mcp-prod-api.rule=Host(`api.operum.adm.br`) && (Path(`/mcp`) || PathPrefix(`/uploads/`) || PathPrefix(`/.well-known/oauth-protected-resource`))"
      - "traefik.http.routers.mcp-prod-api.entrypoints=websecure"
      - "traefik.http.routers.mcp-prod-api.tls.certresolver=myresolver"
      - "traefik.http.routers.mcp-prod-api.service=mcp-server-${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.mcp-prod-api.middlewares=secure-headers@file"

  auth-service:
    image: ${AUTH_SERVICE_IMAGE:?release digest required}
    deploy:
      resources:
        limits:
          memory: 512M
    env_file:
      - .env

  file-service:
    image: ${FILE_SERVICE_IMAGE:?release digest required}
    deploy:
      resources:
        limits:
          memory: 256M
    env_file:
      - .env

  notification-service:
    image: ${NOTIFICATION_SERVICE_IMAGE:?release digest required}
    deploy:
      resources:
        limits:
          memory: 512M
    env_file:
      - .env

  project-service:
    image: ${PROJECT_SERVICE_IMAGE:?release digest required}

  sprint-service:
    image: ${SPRINT_SERVICE_IMAGE:?release digest required}

  postgres:
    volumes:
      - prod-pg-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    # Must repeat --requirepass because compose command: is a full override.
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - prod-redis-data:/data

  redis-session:
    volumes:
      - prod-redis-session-data:/data

  minio:
    # Fixado na imagem que já roda em produção (RELEASE.2025-09-07T16-13-09Z).
    # O base usa quay.io RELEASE.2025-04-08 — aplicá-lo aqui seria um downgrade
    # do storage, e o MinIO não garante leitura de dados gravados por versão mais nova.
    # Para atualizar: testar em staging e trocar o digest.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    volumes:
      - prod-minio-data:/data
    # Console disabled in production — omit --console-address entirely.
    # The base docker-compose.yml binds it to 127.0.0.1:9001; override here
    # to remove it completely for the production profile.
    command: server /data
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio-prod.rule=Host(`storage-prod.operum.adm.br`)"
      - "traefik.http.routers.minio-prod.entrypoints=websecure"
      - "traefik.http.routers.minio-prod.tls.certresolver=myresolver"
      - "traefik.http.services.minio-prod.loadbalancer.server.port=9000"
      - "traefik.http.routers.minio-prod.service=minio-prod"
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Observability (production only) ───────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: always
    # Run as nobody (65534) — Prometheus official image supports this.
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./observability/private/metrics.token:/etc/prometheus/metrics.token:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=2GB"
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256M

  loki:
    image: grafana/loki:3.0.0
    restart: always
    # loki's default uid in the official image
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    volumes:
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:11.0.0
    restart: always
    # grafana's default uid in the official image
    user: "472:472"
    security_opt:
      - no-new-privileges:true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_ROOT_URL=https://grafana.${BASE_DOMAIN}
      # Disable Grafana's built-in user signup (only admin should exist)
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana-${COMPOSE_PROJECT_NAME}.rule=Host(`grafana.${BASE_DOMAIN}`)"
      - "traefik.http.routers.grafana-${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.grafana-${COMPOSE_PROJECT_NAME}.tls.certresolver=myresolver"
      - "traefik.http.services.grafana-${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=3000"
      - "traefik.http.routers.grafana-${COMPOSE_PROJECT_NAME}.middlewares=secure-headers@file"
    networks:
      - traefik-public
      - internal
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          memory: 256M

  alloy:
    image: grafana/alloy:v1.20.1
    restart: always
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
    command: run /etc/alloy/config.alloy
    networks: [internal, logs-collector]

  docker-log-proxy:
    image: node:22-alpine
    command: node /proxy.cjs
    security_opt: ["no-new-privileges:true"]
    read_only: true
    environment: ["DOCKER_FILTER_PROJECT=${COMPOSE_PROJECT_NAME}"]
    volumes:
      - ./observability/docker-log-proxy.cjs:/proxy.cjs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [logs-collector]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: always
    security_opt: ["no-new-privileges:true"]
    volumes: ["./observability/private/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    networks: [internal]

  redis-exporter:
    image: oliver006/redis_exporter:v1.93.0
    environment: ["REDIS_ADDR=redis://redis-session:6379", "REDIS_PASSWORD=${REDIS_PASSWORD}"]
    networks: [internal]
  redis-queue-exporter:
    image: oliver006/redis_exporter:v1.93.0
    environment: ["REDIS_ADDR=redis://redis:6379", "REDIS_PASSWORD=${REDIS_PASSWORD}"]
    networks: [internal]
  redis-cache-exporter:
    image: oliver006/redis_exporter:v1.93.0
    environment: ["REDIS_ADDR=redis://redis-cache:6379", "REDIS_PASSWORD=${REDIS_PASSWORD}"]
    networks: [internal]

volumes:
  prod-pg-data:
  prod-redis-data:
  prod-redis-session-data:
  prod-minio-data:
  prometheus-data:
  loki-data:
  grafana-data:

networks:
  logs-collector:
    internal: true
  traefik-public:
    external: true
