name: Domain Boundaries
on:
  pull_request:
    branches: [main, develop, 'fix/sdd-*', 'feat/sdd-*']
permissions:
  contents: read
concurrency:
  group: domain-boundaries-${{ github.ref }}
  cancel-in-progress: true
jobs:
  boundaries:
    name: Domain boundaries and active project service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/check-domain-boundaries.mjs
      - run: pnpm --dir project-service exec prisma generate
      - run: pnpm --dir project-service test
      - run: pnpm --dir project-service build
