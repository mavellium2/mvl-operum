name: Sprint Integrity

on:
  pull_request:
    branches: [main, develop, 'fix/sdd-*', 'feat/sdd-*']

permissions:
  contents: read

concurrency:
  group: sprint-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: Sprint integrity (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: operum_test
          POSTGRES_PASSWORD: test_only_local_ci
          POSTGRES_DB: operum_sprint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U operum_test -d operum_sprint_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://operum_test:test_only_local_ci@localhost:5432/operum_sprint_test
      OPERUM_SPRINT_TEST_DATABASE_URL: postgresql://operum_test:test_only_local_ci@localhost:5432/operum_sprint_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild @prisma/engines
      - run: pnpm exec prisma generate
      - run: pnpm --dir sprint-service exec prisma generate
      - name: Apply migrations to isolated database
        run: pnpm exec prisma migrate deploy
      - name: Validate sprint service build
        run: pnpm --dir sprint-service build
      # Shared tables and failure-injection triggers require isolation between suites.
      # Concurrent requests inside each test remain enabled.
      - name: Test sprint, timer and card integrity, rollback and tenant isolation
        run: >-
          pnpm exec vitest run --no-file-parallelism
          __tests__/integration/sprintDeletion.postgres.test.ts
          __tests__/integration/timerIntegrity.postgres.test.ts
          __tests__/integration/cardMovement.postgres.test.ts
          sprint-service/src/sprint/sprint.service.spec.ts
          sprint-service/src/card/card.service.spec.ts
          sprint-service/src/common/transaction-conflict.spec.ts
          sprint-service/src/time-entry/time-entry.service.spec.ts
