name: Services Validation
on:
  pull_request:
    branches: [main, develop, 'fix/sdd-*', 'feat/sdd-*']
  workflow_call:
permissions:
  contents: read
jobs:
  services:
    name: Service checks (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, api-gateway, project-service, sprint-service, notification-service, file-service, mcp-server]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Frozen install
        working-directory: ${{ matrix.service }}
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate Prisma when applicable
        working-directory: ${{ matrix.service }}
        run: if [ -f prisma/schema.prisma ]; then pnpm exec prisma generate; fi
      - name: Existing package tests
        working-directory: ${{ matrix.service }}
        run: |
          if [ -n "$(find src -type f \( -name '*.test.ts' -o -name '*.spec.ts' \) -print -quit)" ]; then
            pnpm test
          else
            echo 'Package has no existing tests; build and final-image smoke are mandatory.'
          fi
      - name: Build
        working-directory: ${{ matrix.service }}
        run: pnpm build
      - name: Audit
        working-directory: ${{ matrix.service }}
        run: pnpm audit --audit-level=high
      - name: Build final image
        env:
          SERVICE: ${{ matrix.service }}
        run: docker build -t operum-service-check "$SERVICE"
      - name: Final image smoke with isolated dependencies
        env:
          SERVICE: ${{ matrix.service }}
        run: bash scripts/validation/image-smoke.sh "$SERVICE" operum-service-check
      - name: Pick scanner policy
        id: policy
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          policy=.trivyignore
          if [ "$SERVICE" = api-gateway ]; then policy=.trivyignore-gateway.yaml; fi
          echo "ignore=$policy" >> "$GITHUB_OUTPUT"
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: operum-service-check
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: ${{ steps.policy.outputs.ignore }}
