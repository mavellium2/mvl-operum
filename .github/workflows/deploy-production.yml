name: Deploy to Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'fix/sdd-*', 'feat/sdd-*']
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy' to confirm production deployment"
        required: true

env:
  OWNER: ${{ github.repository_owner }}

# Padrão mínimo para todos os jobs; quem precisa de mais declara no próprio job.
permissions:
  contents: read

jobs:
  service-validation:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/services-validation.yml

  operations-validation:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/operations-validation.yml

  # ── 0. Manual confirmation guard ─────────────────────────────────────────────
  confirm:
    name: Confirm Manual Action
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Check confirmation
        # Entrada do usuário via env, nunca interpolada no script (injeção de shell).
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "deploy" ]; then
            echo "Deployment not confirmed. Type 'deploy' in the confirm field."
            exit 1
          fi

  # ── Security scan (CodeQL + secrets) ─────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan for secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || ((github.event.before != '' && github.event.before != '0000000000000000000000000000000000000000') && github.event.before) || 'HEAD~1' }}
          head: HEAD
          extra_args: --exclude-paths=.trufflehogignore

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3

  # ── Tests, lint, dependency audit ────────────────────────────────────────────
  test:
    name: Test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PNPM_ALLOW_BUILD: "@prisma/engines,bcrypt,esbuild,msgpackr-extract,msw,prisma,sharp,unrs-resolver"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test:run

      - name: Dependency audit
        run: pnpm audit --audit-level=high

  # ── Build, push to ghcr.io, scan image ───────────────────────────────────────
  build:
    name: Build & Push
    # Garante que se for workflow_dispatch, o job confirm PRECISA passar antes do build rodar
    needs: [confirm, security-scan, test, service-validation, operations-validation]
    if: github.event_name != 'pull_request' && always() && (needs.confirm.result == 'success' || needs.confirm.result == 'skipped') && needs.security-scan.result == 'success' && needs.test.result == 'success' && needs.service-validation.result == 'success' && needs.operations-validation.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Normalise owner to lowercase
        id: meta
        run: echo "owner=$(echo '${{ env.OWNER }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/app:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/app:prod
          cache-to: type=inline

      - name: Build and push notification-service image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./notification-service
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/notification-service:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/notification-service:prod
          cache-to: type=inline

      - name: Build and push auth-service image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./auth-service
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/auth-service:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/auth-service:prod
          cache-to: type=inline

      - name: Build and push api-gateway image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./api-gateway
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/api-gateway:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/api-gateway:prod
          cache-to: type=inline

      - name: Build and push file-service image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./file-service
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/file-service:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/file-service:prod
          cache-to: type=inline

      - name: Build and push project-service image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./project-service
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/project-service:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/project-service:prod
          cache-to: type=inline

      - name: Build and push sprint-service image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./sprint-service
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/sprint-service:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/sprint-service:prod
          cache-to: type=inline

      - name: Build and push mcp-server image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./mcp-server
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/mcp-server:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/mcp-server:prod
          cache-to: type=inline

      - name: Scan app image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/app:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Scan notification-service image (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/notification-service:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Scan auth-service image (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/auth-service:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Verify braces patch inside gateway image
        run: docker run --rm --network none -i ghcr.io/${{ steps.meta.outputs.owner }}/api-gateway:${{ github.sha }} node < api-gateway/scripts/verify-braces-patch.cjs

      - name: Scan api-gateway image (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/api-gateway:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore-gateway.yaml

      - name: Scan file-service image (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/file-service:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Scan project-service image (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/project-service:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Scan sprint-service image (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/sprint-service:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Scan mcp-server image (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/mcp-server:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Record approved immutable release
        env:
          RELEASE_OWNER: ${{ steps.meta.outputs.owner }}
          RELEASE_SHA: ${{ github.sha }}
          ROLLBACK_COMPATIBLE: ${{ vars.RELEASE_ROLLBACK_COMPATIBLE || 'false' }}
        run: |
          printf 'RELEASE_SHA=%s\nROLLBACK_COMPATIBLE=%s\n' "$RELEASE_SHA" "$ROLLBACK_COMPATIBLE" > release.env
          for service in app api-gateway auth-service file-service notification-service project-service sprint-service mcp-server; do
            image="ghcr.io/$RELEASE_OWNER/$service"
            digest=$(docker buildx imagetools inspect "$image:$RELEASE_SHA" --format '{{json .Manifest.Digest}}' | tr -d '"')
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            key=$(printf '%s' "$service" | tr '[:lower:]-' '[:upper:]_')
            printf '%s_IMAGE=%s@%s\n' "$key" "$image" "$digest" >> release.env
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approved-release
          path: release.env

  # ── Deploy on VPS (SSH) ───────────────────────────────────────────────────────
  # Sincroniza os docker-compose*.yml do repositório, baixa as imagens do manifesto aprovado e
  # sobe os serviços esperando o health de todos (scripts/deploy/remote-deploy.sh).
  # Secrets do environment `production`:
  #   VPS_HOST, VPS_USER, VPS_SSH_KEY (chave privada ed25519 do usuário de deploy),
  #   VPS_KNOWN_HOSTS (saída de `ssh-keyscan -t ed25519 <host>`), VPS_DEPLOY_PATH
  #   (diretório absoluto com os compose files e o .env na VPS).
  deploy:
    name: Deploy
    needs: build
    # O `success()` implícito exige sucesso em toda a cadeia de `needs`, inclusive
    # no job `confirm`, que fica `skipped` em push — e o deploy era pulado sempre.
    # O build já garante confirm/security-scan/test; basta exigir o build.
    if: github.event_name != 'pull_request' && always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    # Nunca dois deploys ao mesmo tempo; um novo espera o anterior terminar.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      deployments: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            docker-compose.yml
            docker-compose.production.yml
            scripts/deploy
            observability
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: approved-release

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          for v in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS VPS_DEPLOY_PATH; do
            if [ -z "${!v}" ]; then echo "::error::secret $v não configurado no environment production"; exit 1; fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # known_hosts fixo (sem ssh-keyscan no CI): evita confiar em qualquer host na primeira conexão.
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 30
            ConnectTimeout 20
          EOF

      - name: Upload compose files and deploy script
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          incoming="$VPS_DEPLOY_PATH/.deploy-incoming/$GITHUB_SHA"
          ssh vps "mkdir -p $(printf %q "$incoming")"
          scp -q docker-compose.yml docker-compose.production.yml release.env scripts/deploy/*.sh scripts/deploy/*.py "vps:$incoming/"
          scp -qr observability "vps:$incoming/"

      - name: Deploy
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          script="$VPS_DEPLOY_PATH/.deploy-incoming/$GITHUB_SHA/remote-deploy.sh"
          # O token vai por stdin — nunca na linha de comando (visível em `ps` na VPS).
          printf '%s' "$GHCR_TOKEN" | ssh vps "bash $(printf %q "$script") $(printf %q "$VPS_DEPLOY_PATH") $(printf %q "$GITHUB_SHA") $(printf %q "$GITHUB_ACTOR")"

      - name: Smoke test
        run: |
          check() {
            local name=$1 expected=$2; shift 2
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$@" || true)
              if [ "$code" = "$expected" ]; then echo "$name OK ($code)"; return 0; fi
              sleep 10
            done
            echo "::error::$name respondeu $code (esperado $expected)"; return 1
          }
          check "api-gateway /health" 200 https://api.operum.adm.br/health
          # Sem token o MCP precisa responder 401 — prova que o roteamento chega no mcp-server.
          check "mcp-server /mcp" 401 -X POST https://api.operum.adm.br/mcp
          check "app" 200 -L https://operum.adm.br/login

      - name: Cleanup SSH
        if: always()
        run: rm -rf ~/.ssh
