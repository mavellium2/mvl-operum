name: App Image Build

on:
  pull_request:
    branches: [main, develop, 'fix/sdd-*', 'feat/sdd-*']

permissions:
  contents: read

concurrency:
  group: app-image-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: App Image Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Local image only: no registry credentials, push or deploy.
      - name: Build final app image
        run: docker build -t operum-app-check:${{ github.sha }} .

      - name: Verify release history inside standalone image
        run: |
          docker run --rm --network none --entrypoint node operum-app-check:${{ github.sha }} -e '
            const fs = require("node:fs");
            const { version } = require("./package.json");
            const notes = fs.readFileSync("./CHANGELOG.md", "utf8");
            if (!notes.includes(`## [${version}]`)) throw new Error(`Missing release notes for ${version}`);
            console.log(`Standalone release history verified for ${version}`);
          '

      - name: Final app image smoke with isolated dependencies
        run: bash scripts/validation/image-smoke.sh app operum-app-check:${{ github.sha }}
