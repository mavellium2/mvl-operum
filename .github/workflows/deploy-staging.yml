name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  OWNER: ${{ github.repository_owner }}

jobs:
  # ── Security scan (CodeQL + secrets) ─────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan for secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          path: ./
          base: ${{ (github.event.before != '' && github.event.before != '0000000000000000000000000000000000000000') && github.event.before || 'HEAD~1' }}
          head: HEAD
          extra_args: --exclude-paths=.trufflehogignore

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3

  # ── Tests, lint, dependency audit ────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PNPM_ALLOW_BUILD: "@prisma/engines,bcrypt,esbuild,msgpackr-extract,msw,prisma,sharp,unrs-resolver"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test:run

      - name: Dependency audit
        run: pnpm audit --audit-level=high

  # ── Build, push to ghcr.io, scan image ───────────────────────────────────────
  build:
    name: Build & Push
    needs: [security-scan, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Normalise owner to lowercase
        id: meta
        run: echo "owner=$(echo '${{ env.OWNER }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/app:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/app:staging
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/app:staging
          cache-to: type=inline

      - name: Build and push notification-service image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./notification-service
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/notification-service:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/notification-service:staging
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/notification-service:staging
          cache-to: type=inline

      - name: Build and push auth-service image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./auth-service
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/auth-service:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/auth-service:staging
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/auth-service:staging
          cache-to: type=inline

      - name: Build and push api-gateway image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./api-gateway
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/api-gateway:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/api-gateway:staging
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/api-gateway:staging
          cache-to: type=inline

      - name: Build and push file-service image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./file-service
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/file-service:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/file-service:staging
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/file-service:staging
          cache-to: type=inline

      - name: Build and push project-service image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./project-service
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/project-service:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/project-service:staging
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/project-service:staging
          cache-to: type=inline

      - name: Build and push sprint-service image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./sprint-service
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/sprint-service:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/sprint-service:staging
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/sprint-service:staging
          cache-to: type=inline

      - name: Build and push mcp-server image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./mcp-server
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/mcp-server:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/mcp-server:staging
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/mcp-server:staging
          cache-to: type=inline

      - name: Scan app image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/app:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Scan notification-service image (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/notification-service:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Scan auth-service image (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/auth-service:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Verify braces patch inside gateway image
        run: docker run --rm --network none -i ghcr.io/${{ steps.meta.outputs.owner }}/api-gateway:${{ github.sha }} node < api-gateway/scripts/verify-braces-patch.cjs

      - name: Scan api-gateway image (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/api-gateway:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore-gateway.yaml

      - name: Scan file-service image (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/file-service:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Scan project-service image (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/project-service:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Scan sprint-service image (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/sprint-service:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Scan mcp-server image (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/mcp-server:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

    # ── Trigger deploy on VPS ─────────────────────────────────────────────────────
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger staging deploy
        env:
          STAGING_WEBHOOK_URL: ${{ secrets.STAGING_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          if [ -z "$STAGING_WEBHOOK_URL" ]; then
            echo "::warning::STAGING_WEBHOOK_URL not configured — skipping deploy trigger"
            exit 0
          fi
          curl -sf \
            --connect-timeout 30 \
            --max-time 120 \
            --retry 2 \
            --retry-delay 15 \
            --retry-connrefused \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Token: $DEPLOY_WEBHOOK_SECRET" \
            -d "{\"sha\":\"${{ github.sha }}\",\"env\":\"staging\"}" \
            "$STAGING_WEBHOOK_URL"

  # ── DAST — scan after deploy ──────────────────────────────────────────────────
  dast:
    name: DAST (ZAP)
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fix workspace permissions for ZAP Docker container
        run: chmod a+w ${{ github.workspace }}

      - name: Wait for staging to be ready
        run: |
          for i in $(seq 1 5); do
            # -k ignora problemas temporários de SSL na virada do proxy se necessário
            if curl -sfk --max-time 5 https://staging.operum.adm.br/api/health; then
              echo "Staging is up and healthy."
              exit 0
            fi
            echo "Attempt $i/5 — waiting 15s..."
            sleep 15
          done
          echo "Staging did not become ready in time"
          exit 1

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: 'https://staging.operum.adm.br'
          fail_action: false
          issue_title: 'ZAP Baseline Scan - Staging'
